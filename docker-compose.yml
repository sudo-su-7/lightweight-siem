services:

  # ── Loki — log storage ──────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: siem-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Promtail — log shipper ──────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: siem-promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/host-logs:ro          # mount host logs read-only
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yaml -config.expand-env=true
    environment:
      HOSTNAME: ${HOSTNAME:-siem-host}
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ── Grafana — dashboards ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: siem-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-changeme}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Alert Engine ───────────────────────────────────────────────────────────
  alert-engine:
    build:
      context: ./alerting
      dockerfile: Dockerfile
    container_name: siem-alerts
    environment:
      LOKI_URL: http://loki:3100
      RULES_FILE: /app/alerting/rules.yaml
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - ./alerting/rules.yaml:/app/alerting/rules.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  promtail-positions:
